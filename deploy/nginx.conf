# Nginx server block pro Mykoindex (statický web + exporty).
# Uprav server_name a root; zkopíruj do /etc/nginx/sites-available/ a nalinkuj.
server {
    listen 80;
    server_name mykoindex.example.cz;   # <- uprav

    root /var/www/mykoindex;             # <- MYKOINDEX_WEBROOT z run_and_publish.sh
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # data se mění denně → ať je prohlížeč necachuje natvrdo
    location /out/ {
        add_header Cache-Control "no-cache";
    }

    # (doporučeno) HTTPS přes certbot:
    #   sudo certbot --nginx -d mykoindex.example.cz
}
