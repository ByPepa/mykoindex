# --- Cesty ---
paths:
  data_dir: "data"     # cache stažených gridů (v .gitignore)
  out_dir: "out"       # exporty pro frontend

# --- Zdroje dat (nastavení bez tajemství; tokeny jdou přes .env) ---
sources:
  chmi:
    # ČHMÚ MERGE – kombinovaný odhad srážek (radar + srážkoměry), ODIM_H5, 1h úhrn
    merge_dir: "https://opendata.chmi.cz/meteorology/weather/radar/composite/merge1h/hdf5"
    filename_template: "T_PASV23_C_OKPR_{dt:%Y%m%d%H}0000.hdf"
  netatmo:
    api_url: "https://api.netatmo.com/api/getpublicdata"
    token_url: "https://api.netatmo.com/oauth2/token"
    tile_deg: 0.3      # dlaždicování; větší = méně volání (velká oblast), riziko 503
    max_tiles: 120     # pojistka proti přetížení API na obří oblasti
  temperature:
    # "stations" = ČHMÚ + Netatmo pozemní stanice (bez klíče, reálný čas) [default]
    # "era5"     = ERA5-Land přes CDS (potřebuje CDS_API_KEY)
    provider: "stations"
    station_days: 3        # okno průměru pro ČHMÚ stanice (dny; víc = víc stažení)
  era5:
    variable: "2m_temperature"
    dataset: "reanalysis-era5-land"
  terrain:
    # Copernicus DEM GLO-30 – výřez bboxu (stažen: python scripts/fetch_static.py)
    dem_path: "data/dem_bbox.tif"
  forest:
    # ESA WorldCover 2021 – výřez bboxu (stažen: python scripts/fetch_static.py)
    mask_path: "data/worldcover_bbox.tif"
  gbif:
    taxon: "Boletus"
    genus_key: 8287374   # rod Boletus L. (GBIF backbone); null = dohledat podle jména
    country: "CZ"        # kalibrace hlavně časová → celá ČR (v bboxu je nálezů málo)
    year_from: 2015
    year_to: 2025
