# Mykoindex – konfigurace (zdroj pravdy pro parametry, ne kód)
# Vše v lon/lat (WGS84), pokud není uvedeno jinak.

# Oblast: Zlínský + Olomoucký kraj (vč. Jeseníků, Beskyd, Chřibů, Hostýnských vrchů)
bbox: [16.65, 48.85, 18.60, 50.30]   # [lon_min, lat_min, lon_max, lat_max]
resolution_m: 1000                    # pracovní mřížka ~1 km (jako ČHMÚ MERGE)

# --- Model: ladicí páky ---
model:
  tau_days: 12          # exponenciální útlum API30 (dny)
  api_saturation_mm: 60 # vážená suma [mm], při které je moisture = 1
  api_window_days: 30   # okno pro API30
  temp_window_days: 7   # okno pro denní průměrnou teplotu
  w_moist: 0.55         # váha vlhkosti
  w_temp: 0.45          # váha teploty
  # teplotní křivka
  t_min: 5.0            # pod tímto temp = 0
  t_opt: 14.0           # optimum
  t_max: 25.0           # nad tímto temp = 0
  lapse_c_per_100m: 0.6 # výškový teplotní gradient
  elev_ref_m: 300.0     # referenční výška pro T_local
  # terén a les
  aspect_base: 0.82     # aspect_factor = base + span*northness
  aspect_span: 0.18
  forest_base: 0.35     # forest_factor = base + span*forest01
  forest_span: 0.65
  # verdikty (práh na indexu 0-100)
  verdicts:
    - {min: 70, label: "Vyraž"}
    - {min: 50, label: "Dá se"}
    - {min: 32, label: "Počkej"}
    - {min: 0,  label: "Sucho"}

# --- QC měřáků (před sléváním) ---
qc:
  rain_min_mm: 0.0
  rain_max_mm: 250.0
  mad_k: 5.0            # medián ± k*1.4826*MAD

# --- Slévání (conditional merging) ---
merge:
  idw_k: 8             # počet nejbližších stanic
  idw_power: 2.0       # mocnina vzdálenosti
  netatmo_days: 2      # Netatmo koriguje jen posledních N dní

# --- Přepínače modulů ---
modules:
  forest_only: true    # aplikovat forest_factor
  species_layer: false # druhová vrstva (smrk/dub/bříza) – volitelné

# --- Předpověď „kdy porostou" (Open-Meteo, bez klíče) ---
forecast:
  enabled: true
  url: "https://api.open-meteo.com/v1/forecast"
  days: 16                    # horizont předpovědi
  fruiting_lag_days: [7, 12]  # hřiby ~7–12 dní po vydatném dešti
  soak_mm: 20                 # „vydatný déšť" = úhrn ≥ tolik mm během ~3 dnů

# --- Zvýraznění TOP ideálních míst v lese ---
hotspots:
  enabled: true
  n: 12                # kolik TOP tipů
  min_index: 55        # jen body nad tímto indexem
  min_forest: 0.5      # jen dostatečně zalesněné buňky
  min_dist_km: 6       # minimální rozestup tipů (aby nebyly nakupené)

# --- Popis vývoje počasí ---
weather_summary:
  days: 20             # okno pro textový popis

# --- Historie ideálních podmínek (rolující okno) ---
history:
  window_days: 30      # jak dlouho držet historii (starší se maže)
  ideal_min_score: 60  # co se počítá jako „ideální podmínky" (index ≥)

